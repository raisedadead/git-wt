version: 2

project_name: wt

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - ./scripts/completions.sh

builds:
  - main: ./cmd/wt
    binary: wt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/raisedadead/wt/internal/commands.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - man/*
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: raisedadead
      name: homebrew-tap
    homepage: https://github.com/raisedadead/wt
    description: Git worktree manager with bare repo support
    license: MIT
    skip_upload: auto # Skip homebrew for prereleases (alpha, beta, rc)
    install: |
      bin.install "wt"
      bin.install_symlink "wt" => "git-wt"
    extra_install: |
      man1.install "man/wt.1"
      bash_completion.install "completions/wt.bash" => "wt"
      zsh_completion.install "completions/_wt"
      fish_completion.install "completions/wt.fish"
    test: |
      system "#{bin}/wt", "--version"
      system "#{bin}/git-wt", "--version"
